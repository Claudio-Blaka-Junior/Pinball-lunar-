<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pinball Lunar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: one arcade cabinet column. Backglass marquee, LED score panel and playfield share the same width (--cabw); touch pads sit under the glass on touch screens. A single committed night look: plum cabinet, teal playfield, amber LEDs. */
:root {
  --night: #0d0a1f;
  --plum: #1b1538;
  --plum-2: #2d2457;
  --rim: #4a3d8f;
  --line: #f3e7c8;
  --amber: #ffb84d;
  --amber-deep: #c9791a;
  --coral: #ff6a55;
  --mint: #5fe3c0;
  --moon: #d8e4ff;
  --muted: #a39dcb;
  --led: #ffb347;
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --dots: "VT323", "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; background: var(--night); }
body {
  height: 100%;
  box-sizing: border-box;
  margin: 0;
  padding-inline: 16px;
  padding-block: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(90% 60% at 50% -10%, #35297a 0%, rgba(53, 41, 122, 0) 70%),
    radial-gradient(60% 40% at 100% 100%, rgba(255, 106, 85, .10) 0%, rgba(255, 106, 85, 0) 70%),
    var(--night);
  color: var(--line);
  font-family: var(--mono);
  font-size: 13px;
  -webkit-user-select: none;
  user-select: none;
}
body::before {
  content: "";
  position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 22%, #d8e4ff 50%, transparent 52%),
    radial-gradient(1px 1px at 78% 12%, #d8e4ff 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 90% 64%, #ffd9a0 50%, transparent 52%),
    radial-gradient(1px 1px at 8% 78%, #d8e4ff 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 55% 90%, #d8e4ff 50%, transparent 52%),
    radial-gradient(1px 1px at 33% 8%, #ffd9a0 50%, transparent 52%);
}
body > * { position: relative; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }

/* ---------- marquee + LED panel ---------- */
header { flex: none; width: var(--cabw, min(100%, 420px)); min-width: min(100%, 340px); max-width: 100%; display: grid; gap: 8px; }
.marquee {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 7px 6px 7px 12px; border-radius: 12px;
  background: linear-gradient(180deg, #2a2158 0%, #1a1438 100%);
  border: 1px solid var(--rim);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 6px 18px rgba(0, 0, 0, .4);
}
.marquee .moon { width: 22px; height: 22px; flex: none; color: var(--moon); filter: drop-shadow(0 0 6px rgba(216, 228, 255, .6)); }
h1 {
  margin: 0; flex: 0 1 auto; min-width: 0;
  font: 400 19px/1 var(--display); letter-spacing: .06em; white-space: nowrap;
  color: var(--line);
  text-shadow: 0 0 10px rgba(255, 184, 77, .55), 0 2px 0 #0b0720;
}
h1 span { color: var(--amber); }
.icon {
  flex: none; margin-left: auto; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer;
  border-radius: 50%; border: 1px solid var(--rim); background: #150f30; color: var(--muted);
}
.icon:hover { color: var(--line); border-color: var(--amber); }
.icon svg { width: 18px; height: 18px; }
.icon .slash { display: none; }
.icon.muted .waves { display: none; }
.icon.muted .slash { display: block; }

.dmd {
  position: relative; display: grid; grid-template-columns: 1fr auto; column-gap: 14px; row-gap: 4px;
  padding: 10px 12px 8px; border-radius: 10px; overflow: hidden;
  background: #0b0604;
  border: 2px solid #000;
  box-shadow: 0 0 0 2px #3a2f78, inset 0 0 22px rgba(255, 140, 30, .12), 0 8px 20px rgba(0, 0, 0, .5);
}
.dmd::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 0 1.1px, rgba(11, 6, 4, .92) 1.5px) 0 0 / 3px 3px;
}
.lab { display: block; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #a8672a; }
.led {
  display: block; font-family: var(--dots); line-height: .9; color: var(--led);
  text-shadow: 0 0 8px rgba(255, 150, 40, .85), 0 0 2px #ffe0a8;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.led.big { font-size: 52px; }
.dmd-side { display: grid; gap: 4px; justify-items: end; text-align: right; }
.dmd-side .led { font-size: 22px; }
.dmd-side .lab { display: inline-block; margin-right: 8px; }
.dmd-side > div { display: flex; align-items: center; justify-content: flex-end; }
.dots { display: inline-flex; gap: 5px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--led); box-shadow: 0 0 6px rgba(255, 150, 40, .9); }
.dots i.off { background: #3b2410; box-shadow: none; }
.dmd-msg { grid-column: 1 / -1; margin: 0; min-height: 14px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #d98d3a; text-shadow: 0 0 6px rgba(255, 140, 30, .6); }

/* ---------- cabinet ---------- */
.stage { flex: 1 1 0; min-height: 0; width: 100%; display: grid; place-items: center; overflow: visible; }
#cab {
  position: relative; overflow: hidden; border-radius: 18px 18px 12px 12px;
  background: #070d14;
  border: 3px solid #0a0716;
  box-shadow:
    0 0 0 3px var(--rim),
    0 0 0 6px #0a0716,
    0 0 0 8px var(--plum-2),
    0 22px 50px rgba(0, 0, 0, .6),
    0 0 70px rgba(255, 184, 77, .10);
}
#cab::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: linear-gradient(115deg, rgba(255, 255, 255, .07) 0%, rgba(255, 255, 255, 0) 32%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, .04) 100%);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#over {
  position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 12px;
  background: rgba(8, 6, 22, .8); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  text-align: center; padding: 20px;
}
#over[hidden] { display: none; }
#over h2 { margin: 0; font: 400 30px/1.05 var(--display); color: var(--amber); letter-spacing: .04em; text-shadow: 0 0 16px rgba(255, 184, 77, .55), 0 3px 0 #0b0720; text-wrap: balance; }
#over .lab { color: var(--muted); }
#final { font-family: var(--dots); font-size: 46px; line-height: 1; color: var(--led); text-shadow: 0 0 10px rgba(255, 150, 40, .8); margin: 0; }
#recnote { margin: 0; min-height: 16px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mint); }

.btn {
  border: 0; border-radius: 999px; cursor: pointer; letter-spacing: .05em; font-family: var(--display);
  background: linear-gradient(#ffd27a, #f0a52f); color: #2a1700;
  box-shadow: 0 5px 0 #8a5a12, 0 10px 18px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .6);
  transition: transform .06s, box-shadow .06s;
}
.btn:hover { background: linear-gradient(#ffdc92, #f5b04a); }
.btn:active, .btn.on { transform: translateY(4px); box-shadow: 0 1px 0 #8a5a12, 0 4px 8px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .4); }
#again { padding: 13px 26px; font-size: 16px; }

/* ---------- help + touch pads ---------- */
.hint { flex: none; margin: 0; text-align: center; font-size: 11px; color: var(--muted); line-height: 1.9; text-wrap: balance; }
kbd {
  font: 600 10px var(--mono); padding: 2px 6px; margin-inline: 2px; border-radius: 5px;
  background: #1a1438; border: 1px solid var(--rim); border-bottom-width: 2px; color: var(--line);
}
.pads { display: none; flex: none; gap: 12px; width: var(--cabw, min(100%, 420px)); max-width: 100%; align-items: center; }
.pads .btn { flex: 1; min-height: 58px; font-size: 14px; touch-action: none; }
.pads #padLaunch { flex: 1.15; min-height: 64px; background: linear-gradient(#ff9a82, #ee4a3a); color: #2c0600; box-shadow: 0 5px 0 #8f2418, 0 10px 18px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .5); }
.pads #padLaunch:active, .pads #padLaunch.on { box-shadow: 0 1px 0 #8f2418, 0 4px 8px rgba(0, 0, 0, .45); }
@media (hover: none) and (pointer: coarse) {
  .pads { display: flex; }
  .hint { display: none; }
}
@media (max-width: 380px) {
  h1 { font-size: 16px; }
  .led.big { font-size: 44px; }
}
</style>

<header>
  <div class="marquee">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 2.4a9.6 9.6 0 1 0 6.1 17A8.2 8.2 0 0 1 15.5 2.4z" fill="currentColor"/></svg>
    <h1>PINBALL <span>LUNAR</span></h1>
    <button class="icon" id="mute" type="button" aria-pressed="false" aria-label="Som ligado" title="Som">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/>
        <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
        <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
    </button>
  </div>
  <div class="dmd" role="group" aria-label="Placar">
    <div><span class="lab">Pontos</span><output class="led big" id="score">0</output></div>
    <div class="dmd-side">
      <div><span class="lab">Bola</span><span class="dots" id="balls" role="img" aria-label="Bolas restantes"></span></div>
      <div><span class="lab">Mult.</span><output class="led" id="mult">x1</output></div>
      <div><span class="lab">Recorde</span><output class="led" id="best">0</output></div>
    </div>
    <p class="dmd-msg" id="msg" aria-live="polite"></p>
  </div>
</header>

<div class="stage" id="stage">
  <div id="cab">
    <canvas id="cv" aria-label="Mesa de pinball"></canvas>
    <div id="over" hidden>
      <div><span class="lab">Fim de jogo</span></div>
      <h2>Bola final</h2>
      <p id="final">0</p>
      <p id="recnote"></p>
      <button class="btn" id="again" type="button">Jogar de novo</button>
    </div>
  </div>
</div>

<p class="hint"><kbd>←</kbd><kbd>→</kbd> ou <kbd>Z</kbd><kbd>M</kbd> flippers &middot; segure <kbd>Espaço</kbd> e solte para lançar</p>
<div class="pads">
  <button class="btn" id="padL" type="button">Esquerdo</button>
  <button class="btn" id="padLaunch" type="button">Lançar</button>
  <button class="btn" id="padR" type="button">Direito</button>
</div>

<script>
(function () {
  var W = 400, H = 720, R = 8, G = 640, STEP = 1 / 600;
  var REST = 0.49;
  var C = { line: '#f3e7c8', amber: '#ffb84d', coral: '#ff6a55', mint: '#5fe3c0', moon: '#d8e4ff', deep: '#070d14' };
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var bgc = document.createElement('canvas');
  var cab = document.getElementById('cab'), stage = document.getElementById('stage');
  var scale = 1, dpr = 1;

  function fit() {
    var r = stage.getBoundingClientRect();
    scale = Math.max(0.2, Math.min(1.7, Math.min((r.width - 30) / W, (r.height - 30) / H)));
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    cab.style.width = cw + 'px';
    cab.style.height = ch + 'px';
    document.body.style.setProperty('--cabw', (cw + 6) + 'px');
    cv.width = bgc.width = Math.floor(cw * dpr);
    cv.height = bgc.height = Math.floor(ch * dpr);
    buildStatic();
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);

  // ---------- table geometry ----------
  var segs = [];
  function seg(x1, y1, x2, y2, e, kind) { segs.push({ x1: x1, y1: y1, x2: x2, y2: y2, e: e == null ? 0.35 : e, kind: kind || 'wall', flash: 0 }); }
  var N = 40, i;
  for (i = 0; i < N; i++) {
    var a1 = Math.PI + Math.PI * i / N, a2 = Math.PI + Math.PI * (i + 1) / N;
    seg(200 + 190 * Math.cos(a1), 200 + 190 * Math.sin(a1), 200 + 190 * Math.cos(a2), 200 + 190 * Math.sin(a2), 0.25, 'wall');
  }
  seg(10, 200, 10, 585);
  seg(390, 200, 390, 700);
  seg(358, 230, 358, 700);
  seg(358, 700, 390, 700, 0.1, 'floor');
  seg(10, 585, 94, 651);
  seg(358, 585, 274, 651);
  seg(48, 488, 94, 578, 0.5, 'sling');
  seg(320, 488, 274, 578, 0.5, 'sling');

  var posts = [{ x: 70, y: 360, r: 5 }, { x: 298, y: 360, r: 5 }];
  var bumpers = [
    { x: 130, y: 170, r: 20, flash: 0 },
    { x: 238, y: 170, r: 20, flash: 0 },
    { x: 184, y: 250, r: 20, flash: 0 }
  ];
  var lights = [{ x: 134, y: 48, on: false }, { x: 184, y: 48, on: false }, { x: 234, y: 48, on: false }];
  var multLights = [{ x: 124, n: 2 }, { x: 164, n: 3 }, { x: 204, n: 4 }, { x: 244, n: 5 }];
  var flippers = [
    { px: 100, py: 655, s: 1, th: REST, w: 0, held: false, len: 70 },
    { px: 268, py: 655, s: -1, th: REST, w: 0, held: false, len: 70 }
  ];

  var stars = [];
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (i = 0; i < 90; i++) stars.push({ x: rnd() * W, y: rnd() * H, r: 0.4 + rnd() * 1.2, a: 0.12 + rnd() * 0.35 });

  // ---------- state ----------
  var ball = { x: 374, y: 692, vx: 0, vy: 0 };
  var S = { status: 'ready', score: 0, balls: 3, mult: 1, charge: 0, plunging: false, drainT: 0, stillT: 0, msgT: 0 };
  var best = 0;
  try { best = parseInt(localStorage.getItem('pinballLunarBest') || '0', 10) || 0; } catch (e) {}

  var elScore = document.getElementById('score'), elBalls = document.getElementById('balls'),
    elMult = document.getElementById('mult'), elBest = document.getElementById('best'),
    elMsg = document.getElementById('msg'), elOver = document.getElementById('over'),
    elFinal = document.getElementById('final'), elRec = document.getElementById('recnote');

  function fmt(n) { return n.toLocaleString('pt-BR'); }
  function hud() {
    elScore.textContent = fmt(S.score);
    elMult.textContent = 'x' + S.mult;
    elBest.textContent = fmt(best);
    var h = '';
    for (var k = 0; k < 3; k++) h += '<i class="' + (k < S.balls ? '' : 'off') + '"></i>';
    elBalls.innerHTML = h;
    elBalls.setAttribute('aria-label', S.balls + ' bolas restantes');
  }
  function say(t, ms) { elMsg.textContent = t; S.msgT = ms || 0; }
  function readyMsg() { say('Segure Espaço ou Lançar e solte', 0); }
  function addScore(n) { S.score += n; elScore.textContent = fmt(S.score); }

  // ---------- effects ----------
  var sparks = [], rings = [], pops = [], trail = [], shake = 0;
  function burst(x, y, n, col, spd) {
    if (reduce) n = Math.ceil(n / 3);
    for (var k = 0; k < n; k++) {
      var a = Math.random() * 6.2832, v = (0.4 + Math.random()) * spd;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: col });
    }
    if (sparks.length > 160) sparks.splice(0, sparks.length - 160);
  }
  function ring(x, y, col) { if (!reduce) rings.push({ x: x, y: y, r: 12, life: 1, col: col }); }
  function pop(x, y, txt, col) { pops.push({ x: x, y: y, txt: txt, life: 1, col: col || C.amber }); if (pops.length > 10) pops.shift(); }

  // ---------- sound ----------
  var ac = null, muted = false;
  function sfx(f, d, type, g, slide) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      var t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
      gn.gain.setValueAtTime(g || 0.04, t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(gn); gn.connect(ac.destination);
      o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.classList.toggle('muted', muted);
    muteBtn.setAttribute('aria-label', muted ? 'Som desligado' : 'Som ligado');
    muteBtn.setAttribute('aria-pressed', String(muted));
  });

  // ---------- game flow ----------
  function resetBall() {
    ball.x = 374; ball.y = 692; ball.vx = 0; ball.vy = 0;
    S.status = 'ready'; S.charge = 0; S.stillT = 0;
    for (var k = 0; k < lights.length; k++) lights[k].on = false;
    S.mult = 1; trail.length = 0;
    hud();
    readyMsg();
  }
  function newGame() {
    if (S.status !== 'over') return;
    S.score = 0; S.balls = 3; S.mult = 1;
    elOver.hidden = true;
    resetBall();
  }
  function launch() {
    var c = Math.max(S.charge, 0.2);
    ball.x = 374; ball.y = 692;
    ball.vx = 0; ball.vy = -(880 + 420 * c);
    S.status = 'playing'; S.stillT = 0;
    burst(374, 700, 8, C.amber, 160);
    sfx(160, 0.25, 'sawtooth', 0.05, 500);
    say('', 0);
  }
  function loseBall() {
    S.balls--;
    S.status = 'drain'; S.drainT = 1;
    sfx(300, 0.5, 'triangle', 0.06, -220);
    say('Bola perdida', 1200);
    hud();
  }
  function afterDrain() {
    if (S.balls <= 0) {
      S.status = 'over';
      var rec = S.score > best;
      if (rec) { best = S.score; try { localStorage.setItem('pinballLunarBest', String(best)); } catch (e) {} }
      elFinal.textContent = fmt(S.score);
      elRec.textContent = rec ? 'Novo recorde' : 'Recorde: ' + fmt(best);
      elOver.hidden = false;
      hud();
      document.getElementById('again').focus({ preventScroll: true });
    } else {
      resetBall();
    }
  }

  // ---------- input ----------
  function setFlip(i, v) {
    var f = flippers[i];
    if (f.held !== v) { f.held = v; if (v) sfx(190, 0.05, 'triangle', 0.05, -60); }
    document.getElementById(i === 0 ? 'padL' : 'padR').classList.toggle('on', v);
  }
  function startPlunge() { if (S.status === 'ready') S.plunging = true; document.getElementById('padLaunch').classList.add('on'); }
  function endPlunge() {
    if (S.plunging && S.status === 'ready') launch();
    S.plunging = false;
    document.getElementById('padLaunch').classList.remove('on');
  }

  var LEFT = { ArrowLeft: 1, KeyZ: 1, KeyA: 1 }, RIGHT = { ArrowRight: 1, KeyM: 1, KeyD: 1, Slash: 1 }, PLUNGE = { Space: 1, ArrowDown: 1 };
  window.addEventListener('keydown', function (e) {
    if (LEFT[e.code]) { setFlip(0, true); e.preventDefault(); }
    else if (RIGHT[e.code]) { setFlip(1, true); e.preventDefault(); }
    else if (PLUNGE[e.code]) {
      e.preventDefault();
      if (S.status === 'over') newGame(); else startPlunge();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (LEFT[e.code]) setFlip(0, false);
    else if (RIGHT[e.code]) setFlip(1, false);
    else if (PLUNGE[e.code]) endPlunge();
  });
  window.addEventListener('blur', function () { setFlip(0, false); setFlip(1, false); S.plunging = false; });

  var ptrs = {};
  cv.addEventListener('pointerdown', function (e) {
    var r = cv.getBoundingClientRect();
    var lx = (e.clientX - r.left) / r.width * W;
    var kind = (lx > 348 && S.status === 'ready') ? 'P' : (lx < W / 2 ? 'L' : 'R');
    ptrs[e.pointerId] = kind;
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    if (kind === 'L') setFlip(0, true); else if (kind === 'R') setFlip(1, true); else startPlunge();
    e.preventDefault();
  });
  function release(e) {
    var k = ptrs[e.pointerId];
    if (!k) return;
    delete ptrs[e.pointerId];
    if (k === 'L') setFlip(0, false); else if (k === 'R') setFlip(1, false); else endPlunge();
  }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  function bindPad(id, down, up) {
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function (e) { try { el.setPointerCapture(e.pointerId); } catch (x) {} down(); e.preventDefault(); });
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }
  bindPad('padL', function () { setFlip(0, true); }, function () { setFlip(0, false); });
  bindPad('padR', function () { setFlip(1, true); }, function () { setFlip(1, false); });
  bindPad('padLaunch', startPlunge, endPlunge);
  document.getElementById('again').addEventListener('click', newGame);

  // ---------- physics ----------
  function kick(nx, ny, min) {
    var vn = ball.vx * nx + ball.vy * ny;
    if (vn < min) { ball.vx += (min - vn) * nx; ball.vy += (min - vn) * ny; }
  }

  function hitSeg(s) {
    var dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    var t = ((ball.x - s.x1) * dx + (ball.y - s.y1) * dy) / (dx * dx + dy * dy);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    var px = s.x1 + dx * t, py = s.y1 + dy * t;
    var nx = ball.x - px, ny = ball.y - py, d2 = nx * nx + ny * ny;
    if (d2 >= R * R || d2 < 1e-9) return;
    var d = Math.sqrt(d2);
    nx /= d; ny /= d;
    ball.x += nx * (R - d); ball.y += ny * (R - d);
    var vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) {
      ball.vx -= (1 + s.e) * vn * nx;
      ball.vy -= (1 + s.e) * vn * ny;
      if (s.kind === 'sling') {
        kick(nx, ny, 480);
        s.flash = 1;
        addScore(10 * S.mult);
        burst(px, py, 6, C.coral, 190);
        sfx(330, 0.07, 'square', 0.04, 160);
      }
    }
  }

  function hitCircle(c, e, kickMin) {
    var dx = ball.x - c.x, dy = ball.y - c.y, rr = R + c.r, d2 = dx * dx + dy * dy;
    if (d2 >= rr * rr || d2 < 1e-9) return;
    var d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
    ball.x = c.x + nx * rr; ball.y = c.y + ny * rr;
    var vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) {
      ball.vx -= (1 + e) * vn * nx;
      ball.vy -= (1 + e) * vn * ny;
      if (kickMin) {
        kick(nx, ny, kickMin);
        c.flash = 1;
        var pts = 100 * S.mult;
        addScore(pts);
        burst(c.x + nx * c.r, c.y + ny * c.r, 10, C.amber, 260);
        ring(c.x, c.y, C.amber);
        pop(c.x, c.y - c.r - 8, '+' + pts, C.line);
        if (!reduce) shake = 2.2;
        sfx(520 + Math.random() * 90, 0.09, 'square', 0.04, 300);
      }
    }
  }

  function hitFlipper(f) {
    var cs = Math.cos(f.th), sn = Math.sin(f.th);
    var ex = f.px + f.s * f.len * cs, ey = f.py + f.len * sn;
    var dx = ex - f.px, dy = ey - f.py;
    var t = ((ball.x - f.px) * dx + (ball.y - f.py) * dy) / (dx * dx + dy * dy);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    var px = f.px + dx * t, py = f.py + dy * t, rf = 10 - 4 * t;
    var nx = ball.x - px, ny = ball.y - py, d2 = nx * nx + ny * ny, rr = R + rf;
    if (d2 >= rr * rr || d2 < 1e-9) return;
    var d = Math.sqrt(d2);
    nx /= d; ny /= d;
    ball.x += nx * (rr - d); ball.y += ny * (rr - d);
    var sx = f.w * t * f.len * (-f.s * sn), sy = f.w * t * f.len * cs;
    var rvx = ball.vx - sx, rvy = ball.vy - sy;
    var vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      ball.vx -= 1.25 * vn * nx;
      ball.vy -= 1.25 * vn * ny;
    }
  }

  function step(dt) {
    var f, k;
    for (k = 0; k < 2; k++) {
      f = flippers[k];
      var tgt = f.held ? -REST : REST, sp = (f.held ? 17 : 9) * dt, old = f.th;
      f.th += Math.max(-sp, Math.min(sp, tgt - f.th));
      f.w = (f.th - old) / dt;
    }
    if (S.status !== 'playing') return;

    ball.vy += G * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    for (k = 0; k < segs.length; k++) hitSeg(segs[k]);
    for (k = 0; k < posts.length; k++) hitCircle(posts[k], 0.5, 0);
    for (k = 0; k < bumpers.length; k++) hitCircle(bumpers[k], 0.5, 450);
    hitFlipper(flippers[0]);
    hitFlipper(flippers[1]);

    var sp2 = ball.vx * ball.vx + ball.vy * ball.vy;
    if (sp2 > 1400 * 1400) { var m = 1400 / Math.sqrt(sp2); ball.vx *= m; ball.vy *= m; }
  }

  function afterSteps(dt) {
    var k;
    for (k = 0; k < bumpers.length; k++) bumpers[k].flash = Math.max(0, bumpers[k].flash - dt * 4);
    for (k = 0; k < segs.length; k++) if (segs[k].flash) segs[k].flash = Math.max(0, segs[k].flash - dt * 4);
    shake = Math.max(0, shake - dt * 14);
    for (k = sparks.length - 1; k >= 0; k--) {
      var p = sparks[k];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt * 2.4;
      if (p.life <= 0) sparks.splice(k, 1);
    }
    for (k = rings.length - 1; k >= 0; k--) {
      rings[k].r += dt * 110; rings[k].life -= dt * 2.6;
      if (rings[k].life <= 0) rings.splice(k, 1);
    }
    for (k = pops.length - 1; k >= 0; k--) {
      pops[k].y -= dt * 34; pops[k].life -= dt * 1.5;
      if (pops[k].life <= 0) pops.splice(k, 1);
    }
    if (S.msgT > 0) { S.msgT -= dt * 1000; if (S.msgT <= 0 && S.status === 'ready') readyMsg(); else if (S.msgT <= 0) say('', 0); }

    if (S.status === 'ready') {
      if (S.plunging) S.charge = Math.min(1, S.charge + dt / 1.1);
      ball.x = 374; ball.y = 692 + S.charge * 14;
    } else if (S.status === 'playing') {
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > 14) trail.shift();
      for (k = 0; k < lights.length; k++) {
        var l = lights[k], dx = ball.x - l.x, dy = ball.y - l.y;
        if (!l.on && dx * dx + dy * dy < 18 * 18) {
          l.on = true;
          var pts = 500 * S.mult;
          addScore(pts);
          burst(l.x, l.y, 8, C.mint, 150);
          pop(l.x, l.y + 22, '+' + pts, C.mint);
          sfx(880, 0.1, 'triangle', 0.05, 200);
          if (lights[0].on && lights[1].on && lights[2].on) {
            addScore(2000 * S.mult);
            S.mult = Math.min(5, S.mult + 1);
            for (var j = 0; j < lights.length; j++) lights[j].on = false;
            elMult.textContent = 'x' + S.mult;
            burst(184, 90, 18, C.mint, 260);
            say('Bônus lunar! Multiplicador x' + S.mult, 2200);
            sfx(660, 0.4, 'triangle', 0.06, 700);
          }
        }
      }
      var spd = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      if (ball.x > 360 && ball.y > 650 && spd < 40) {
        S.status = 'ready'; S.charge = 0; ball.vx = 0; ball.vy = 0; trail.length = 0;
        readyMsg();
      } else if (spd < 15) {
        S.stillT += dt;
        if (S.stillT > 2.5) { ball.vx = (Math.random() < 0.5 ? -1 : 1) * 220; ball.vy = -320; S.stillT = 0; }
      } else S.stillT = 0;
      if ((ball.x < 358 && ball.y > 735) || ball.y > H + 40) loseBall();
    } else if (S.status === 'drain') {
      S.drainT -= dt;
      if (S.drainT <= 0) afterDrain();
    }
  }

  // ---------- static layer (table art, rails) ----------
  function pfPath(c) {
    c.beginPath();
    c.moveTo(10, H);
    c.lineTo(10, 200);
    c.arc(200, 200, 190, Math.PI, 2 * Math.PI);
    c.lineTo(390, H);
    c.closePath();
  }
  function strokeWalls(c, col, w, dx, dy) {
    c.beginPath();
    for (var k = 0; k < segs.length; k++) {
      var s = segs[k];
      if (s.kind !== 'wall') continue;
      c.moveTo(s.x1 + dx, s.y1 + dy); c.lineTo(s.x2 + dx, s.y2 + dy);
    }
    c.strokeStyle = col; c.lineWidth = w; c.stroke();
  }

  function buildStatic() {
    var c = bgc.getContext('2d'), sc = scale * dpr, k;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, bgc.width, bgc.height);
    c.setTransform(sc, 0, 0, sc, 0, 0);
    c.fillStyle = C.deep; c.fillRect(0, 0, W, H);

    c.save();
    pfPath(c);
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1d5570'); g.addColorStop(0.55, '#10364b'); g.addColorStop(1, '#07182a');
    c.fillStyle = g; c.fill();
    c.clip();

    var spot = c.createRadialGradient(184, 340, 10, 184, 340, 330);
    spot.addColorStop(0, 'rgba(130,210,240,.20)'); spot.addColorStop(1, 'rgba(130,210,240,0)');
    c.fillStyle = spot; c.fillRect(0, 0, W, H);

    for (k = 0; k < stars.length; k++) {
      c.globalAlpha = stars[k].a; c.fillStyle = C.moon;
      c.beginPath(); c.arc(stars[k].x, stars[k].y, stars[k].r, 0, 6.3); c.fill();
    }
    c.globalAlpha = 1;

    // orbit and planet
    c.save();
    c.translate(184, 432); c.rotate(-0.42); c.scale(1, 0.34);
    c.beginPath(); c.arc(0, 0, 136, 0, 6.2832);
    c.setLineDash([2, 8]); c.strokeStyle = 'rgba(216,228,255,.26)'; c.lineWidth = 3; c.stroke();
    c.restore();
    c.fillStyle = 'rgba(255,184,77,.8)';
    c.beginPath(); c.arc(298, 396, 3.5, 0, 6.3); c.fill();

    // crescent moon
    var mg = c.createLinearGradient(100, 360, 260, 510);
    mg.addColorStop(0, 'rgba(236,241,255,.30)'); mg.addColorStop(1, 'rgba(120,150,230,.10)');
    c.beginPath(); c.arc(184, 432, 88, 0, 6.2832); c.arc(214, 416, 77, 0, 6.2832);
    c.fillStyle = mg; c.fill('evenodd');
    c.strokeStyle = 'rgba(216,228,255,.16)'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(184, 432, 88, 1.9, 4.2); c.stroke();

    // arc dot lights
    for (k = 0; k < 15; k++) {
      var aa = Math.PI * (1.08 + 0.84 * k / 14);
      c.fillStyle = 'rgba(255,184,77,.30)';
      c.beginPath(); c.arc(200 + 168 * Math.cos(aa), 200 + 168 * Math.sin(aa), 2.4, 0, 6.3); c.fill();
    }

    // painted lettering
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(243,231,200,.10)';
    c.font = '400 11px "IBM Plex Mono", monospace';
    try { c.letterSpacing = '6px'; } catch (e) {}
    c.fillText('PINBALL', 187, 522);
    c.font = '400 30px Bungee, Impact, sans-serif';
    try { c.letterSpacing = '5px'; } catch (e) {}
    c.fillText('LUNAR', 187, 550);
    try { c.letterSpacing = '0px'; } catch (e) {}

    // sling rubber blocks
    var blocks = [[48, 488, 94, 578, 30, 578], [320, 488, 274, 578, 338, 578]];
    for (k = 0; k < 2; k++) {
      var bl = blocks[k];
      c.beginPath(); c.moveTo(bl[0], bl[1]); c.lineTo(bl[2], bl[3]); c.lineTo(bl[4], bl[5]); c.closePath();
      c.fillStyle = 'rgba(40,12,40,.55)'; c.fill();
      c.strokeStyle = 'rgba(255,106,85,.35)'; c.lineWidth = 1.5; c.stroke();
    }

    // lane
    c.fillStyle = 'rgba(0,0,0,.34)'; c.fillRect(358, 200, 32, H - 200);
    c.strokeStyle = 'rgba(243,231,200,.09)'; c.lineWidth = 2; c.setLineDash([3, 9]);
    c.beginPath(); c.moveTo(374, 250); c.lineTo(374, 640); c.stroke();
    c.setLineDash([]);

    // vignette
    var vg = c.createRadialGradient(200, 360, 190, 200, 360, 470);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
    c.restore();

    // metal rails
    c.lineCap = 'round'; c.lineJoin = 'round';
    strokeWalls(c, 'rgba(0,0,0,.5)', 8, 2, 3);
    strokeWalls(c, '#7d89a6', 5.4, 0, 0);
    strokeWalls(c, '#dfe6f5', 3, 0, -0.4);
    strokeWalls(c, 'rgba(255,255,255,.85)', 1, 0, -1);
  }
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildStatic); } catch (e) {}

  // ---------- dynamic drawing ----------
  function drawBumper(b) {
    var f = b.flash;
    ctx.fillStyle = 'rgba(0,0,0,.38)';
    ctx.beginPath(); ctx.ellipse(b.x + 3, b.y + 6, b.r + 6, b.r + 3, 0, 0, 6.3); ctx.fill();
    var rg = ctx.createLinearGradient(b.x - b.r, b.y - b.r, b.x + b.r, b.y + b.r);
    rg.addColorStop(0, '#f4f7ff'); rg.addColorStop(0.5, '#8c98b6'); rg.addColorStop(1, '#4b5575');
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, 6.3); ctx.fillStyle = rg; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1.5, 0, 6.3); ctx.fillStyle = '#3a1030'; ctx.fill();
    var cg = ctx.createRadialGradient(b.x - 6, b.y - 7, 1, b.x, b.y, b.r);
    if (f > 0.1) { cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.6, '#ffd58a'); cg.addColorStop(1, C.amber); }
    else { cg.addColorStop(0, '#ffb09b'); cg.addColorStop(0.55, '#ff5f4b'); cg.addColorStop(1, '#a3243a'); }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 0.5, 0, 6.3); ctx.fillStyle = cg; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.52, 0, 6.3);
    ctx.strokeStyle = f > 0.1 ? '#ffffff' : 'rgba(255,214,150,.9)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.22, 0, 6.3); ctx.fillStyle = 'rgba(40,8,30,.55)'; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.ellipse(b.x - 7, b.y - 9, 6, 3, -0.6, 0, 6.3); ctx.fill();
    if (f > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var hg = ctx.createRadialGradient(b.x, b.y, b.r, b.x, b.y, b.r + 38);
      hg.addColorStop(0, 'rgba(255,190,90,' + (0.55 * f) + ')'); hg.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 38, 0, 6.3); ctx.fill();
      ctx.restore();
    }
  }

  function drawFlipper(f) {
    var ex = f.px + f.s * f.len * Math.cos(f.th), ey = f.py + f.len * Math.sin(f.th);
    var ang = Math.atan2(ey - f.py, ex - f.px), nx = -Math.sin(ang), ny = Math.cos(ang);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.save(); ctx.translate(3, 6);
    flipPath(f, ex, ey, ang, nx, ny); ctx.fill();
    ctx.restore();
    flipPath(f, ex, ey, ang, nx, ny);
    var gr = ctx.createLinearGradient(f.px + nx * 10, f.py + ny * 10, f.px - nx * 10, f.py - ny * 10);
    gr.addColorStop(0, f.held ? '#fff0c9' : '#ffe2a8'); gr.addColorStop(0.5, C.amber); gr.addColorStop(1, '#c9791a');
    ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = '#2a1535'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(f.px + nx * 4, f.py + ny * 4); ctx.lineTo(ex + nx * 2, ey + ny * 2); ctx.stroke();
    ctx.strokeStyle = C.coral; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(ex, ey, 6, 0, 6.3); ctx.stroke();
    var pg = ctx.createRadialGradient(f.px - 1.5, f.py - 1.5, 0.5, f.px, f.py, 5);
    pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#5a6482');
    ctx.beginPath(); ctx.arc(f.px, f.py, 4.5, 0, 6.3); ctx.fillStyle = pg; ctx.fill();
  }
  function flipPath(f, ex, ey, ang, nx, ny) {
    ctx.beginPath();
    ctx.moveTo(f.px + nx * 10, f.py + ny * 10);
    ctx.lineTo(ex + nx * 6, ey + ny * 6);
    ctx.arc(ex, ey, 6, ang + Math.PI / 2, ang - Math.PI / 2, true);
    ctx.lineTo(f.px - nx * 10, f.py - ny * 10);
    ctx.arc(f.px, f.py, 10, ang - Math.PI / 2, ang + Math.PI / 2, true);
    ctx.closePath();
  }

  function insertLight(x, y, rx, ry, on, col) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.3);
    if (on) {
      ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fillStyle = col; ctx.fill(); ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(x - rx * 0.25, y - ry * 0.3, rx * 0.35, ry * 0.25, 0, 0, 6.3); ctx.fill();
    } else {
      ctx.fillStyle = '#0d2736'; ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.3);
    ctx.strokeStyle = on ? 'rgba(255,255,255,.7)' : 'rgba(243,231,200,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  function draw() {
    var k, s, sc = scale * dpr, sx = 0, sy = 0;
    if (shake > 0.05) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = C.deep; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(sc, 0, 0, sc, sx * sc, sy * sc);
    ctx.drawImage(bgc, 0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // rollover and multiplier inserts
    for (k = 0; k < lights.length; k++) insertLight(lights[k].x, lights[k].y, 7, 9, lights[k].on, C.mint);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (k = 0; k < multLights.length; k++) {
      var ml = multLights[k], on = S.mult >= ml.n;
      insertLight(ml.x, 322, 12, 12, on, C.amber);
      ctx.fillStyle = on ? '#3a2000' : 'rgba(243,231,200,.5)';
      ctx.font = '600 11px "IBM Plex Mono", monospace';
      ctx.fillText('x' + ml.n, ml.x, 322.5);
    }

    // slings
    for (k = 0; k < segs.length; k++) {
      s = segs[k];
      if (s.kind !== 'sling') continue;
      ctx.save();
      ctx.strokeStyle = '#4a1230'; ctx.lineWidth = 11;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      ctx.strokeStyle = s.flash > 0.1 ? '#ffffff' : C.coral;
      if (s.flash > 0) { ctx.shadowColor = C.coral; ctx.shadowBlur = 18 * s.flash; }
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1 - 1.5); ctx.lineTo(s.x2, s.y2 - 1.5); ctx.stroke();
    }

    // posts
    for (k = 0; k < posts.length; k++) {
      var po = posts[k];
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(po.x + 2, po.y + 3, po.r + 1, po.r, 0, 0, 6.3); ctx.fill();
      var pg = ctx.createRadialGradient(po.x - 1.5, po.y - 1.5, 0.5, po.x, po.y, po.r + 1);
      pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#6f7a99');
      ctx.beginPath(); ctx.arc(po.x, po.y, po.r + 1, 0, 6.3); ctx.fillStyle = pg; ctx.fill();
    }

    for (k = 0; k < bumpers.length; k++) drawBumper(bumpers[k]);

    // rings and sparks
    for (k = 0; k < rings.length; k++) {
      var rg = rings[k];
      ctx.strokeStyle = rg.col; ctx.globalAlpha = Math.max(0, rg.life) * 0.7; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, 6.3); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // plunger
    var top = 692 + S.charge * 14 + R;
    if (S.status === 'ready' || S.status === 'playing') {
      ctx.strokeStyle = '#aab6cc'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(374, top + 6);
      var zz = 1;
      for (var yy = top + 10; yy < H; yy += 4) { ctx.lineTo(374 + 7 * zz, yy); zz = -zz; }
      ctx.stroke();
      var kg = ctx.createLinearGradient(0, top, 0, top + 6);
      kg.addColorStop(0, '#ffe2a8'); kg.addColorStop(1, '#c9791a');
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.rect(364, top, 20, 6); ctx.fill();
      ctx.strokeStyle = '#2a1535'; ctx.lineWidth = 1; ctx.stroke();
    }
    if (S.status === 'ready') {
      // power bar
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.fillRect(361, 646, 26, 5);
      ctx.fillStyle = S.charge > 0.85 ? C.coral : S.charge > 0.5 ? C.amber : C.mint;
      ctx.fillRect(361, 646, 26 * S.charge, 5);
      // chevrons
      var t = performance.now() / 420;
      for (k = 0; k < 3; k++) {
        ctx.globalAlpha = 0.25 + 0.4 * (0.5 + 0.5 * Math.sin(t - k * 0.9));
        ctx.strokeStyle = C.line; ctx.lineWidth = 2;
        var cy = 622 - k * 14;
        ctx.beginPath(); ctx.moveTo(366, cy + 4); ctx.lineTo(374, cy - 3); ctx.lineTo(382, cy + 4); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    drawFlipper(flippers[0]);
    drawFlipper(flippers[1]);

    // ball trail and ball
    if (S.status === 'playing') {
      var spd = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      if (spd > 350 && !reduce) {
        for (k = 0; k < trail.length; k++) {
          var q = trail[k], f2 = (k + 1) / trail.length;
          ctx.fillStyle = 'rgba(170,205,255,' + (0.22 * f2) + ')';
          ctx.beginPath(); ctx.arc(q.x, q.y, R * (0.35 + 0.6 * f2), 0, 6.3); ctx.fill();
        }
      }
    }
    if (S.status !== 'drain') {
      ctx.fillStyle = 'rgba(0,0,0,.38)';
      ctx.beginPath(); ctx.ellipse(ball.x + 3, ball.y + 5, R, R * 0.8, 0, 0, 6.3); ctx.fill();
      var bg = ctx.createRadialGradient(ball.x - 3, ball.y - 3.5, 0.5, ball.x, ball.y, R);
      bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.28, '#dfe7fa'); bg.addColorStop(0.65, '#8a98bd'); bg.addColorStop(1, '#2b3354');
      ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, 6.3); ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = 'rgba(160,200,255,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, R - 1, 0.3, 1.9); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(ball.x - 2.8, ball.y - 3.2, 1.5, 0, 6.3); ctx.fill();
    }

    // sparks
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 2;
    for (k = 0; k < sparks.length; k++) {
      var p = sparks[k];
      ctx.strokeStyle = p.col; ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
    }
    ctx.restore();

    // score popups
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '400 14px Bungee, Impact, sans-serif';
    for (k = 0; k < pops.length; k++) {
      var pp = pops[k];
      ctx.globalAlpha = Math.max(0, Math.min(1, pp.life * 1.6));
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(7,13,20,.85)'; ctx.strokeText(pp.txt, pp.x, pp.y);
      ctx.fillStyle = pp.col; ctx.fillText(pp.txt, pp.x, pp.y);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- loop ----------
  var last = performance.now(), acc = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += dt;
    var n = 0;
    while (acc >= STEP && n < 40) { step(STEP); acc -= STEP; n++; }
    if (n >= 40) acc = 0;
    afterSteps(dt);
    draw();
    requestAnimationFrame(frame);
  }

  fit();
  hud();
  readyMsg();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
